<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonal Field — ear trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF2FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#02040B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tonal Field">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Sora:wght@300;400;500;600&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
/* an app, not a page: no text selection or iOS callouts except where you type */
.wrap{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{-webkit-user-select:text;user-select:text}
body{height:100%;overflow:hidden}
*,*::before,*::after{box-sizing:inherit}

/* ===== Interstellar ===== */
body[data-skin="space"]{
  --fd:"Unbounded","Sora",system-ui,sans-serif; --fb:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif; --fc:"Sora",system-ui,sans-serif;
  --bg:#EEF2FB; --ink:#0C1630; --muted:#5A6788; --faint:#B4BFDA; --line:rgba(12,22,48,.12);
  --blue:#2C5BE0; --orange:#E5661A; --orangeA:rgba(229,102,26,.25); --star:#3B5FCC;
  --neb1:rgba(44,91,224,.14); --neb2:rgba(229,102,26,.10); --screen:#0C1630; --trace:#E5661A; --glow:#E5661A; --ring:#FFE2C2; --core:rgba(255,190,120,.95); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-skin="space"]{
  --bg:#02040B; --ink:#EAF0FF; --muted:#7C88A8; --faint:#2E3854; --line:rgba(150,170,230,.14);
  --blue:#74A4FF; --orange:#FF8A3D; --orangeA:rgba(255,138,61,.28); --star:#FFFFFF;
  --neb1:rgba(40,80,200,.30); --neb2:rgba(255,120,40,.16); --glow:#FF8A3D; --ring:#FFE2C2; --core:rgba(255,190,120,.95); color-scheme:dark;}}
:root[data-theme="dark"] body[data-skin="space"]{
  --bg:#02040B; --ink:#EAF0FF; --muted:#7C88A8; --faint:#2E3854; --line:rgba(150,170,230,.14);
  --blue:#74A4FF; --orange:#FF8A3D; --orangeA:rgba(255,138,61,.28); --star:#FFFFFF;
  --neb1:rgba(40,80,200,.30); --neb2:rgba(255,120,40,.16); --glow:#FF8A3D; --ring:#FFE2C2; --core:rgba(255,190,120,.95); color-scheme:dark;}

/* ===== Pocket radio ===== */
body[data-skin="radio"]{
  --fd:"VT323",ui-monospace,monospace; --fb:"Space Mono",ui-monospace,Menlo,monospace; --fc:"VT323",ui-monospace,monospace;
  --bg:#B9BEC0; --panel:#D8DBD9; --panel2:#C9CDCC; --ink:#1C2329; --muted:#56616A; --faint:#98A1A7; --line:rgba(28,35,41,.16);
  --blue:#2F7FCF; --orange:#EE7418; --orangeA:transparent; --screen:#15314A; --trace:#FF9B45; --lcd:#9FD0FF; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-skin="radio"] .chip{text-shadow:0 1px 0 rgba(0,0,0,.7),0 0 10px rgba(0,0,0,.35)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-skin="radio"]{
  --bg:#0F1214; --panel:#1C2024; --panel2:#262B30; --ink:#E2E6E8; --muted:#8E99A1; --faint:#46505A; --line:rgba(226,230,232,.11);
  --blue:#5AA6F0; --orange:#FF8A33; --screen:#0A1D2D; --trace:#FFA458; --lcd:#8CC6FF; color-scheme:dark;}}
:root[data-theme="dark"] body[data-skin="radio"]{
  --bg:#0F1214; --panel:#1C2024; --panel2:#262B30; --ink:#E2E6E8; --muted:#8E99A1; --faint:#46505A; --line:rgba(226,230,232,.11);
  --blue:#5AA6F0; --orange:#FF8A33; --screen:#0A1D2D; --trace:#FFA458; --lcd:#8CC6FF; color-scheme:dark;}

body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:1.5px solid var(--orange);outline-offset:3px;border-radius:4px}

/* background layers */
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:none}
.nebula{position:fixed;inset:0;pointer-events:none;z-index:0;display:none;
  background:radial-gradient(60vmax 40vmax at 18% 22%,var(--neb1),transparent 70%),radial-gradient(50vmax 35vmax at 86% 78%,var(--neb2),transparent 70%),radial-gradient(40vmax 30vmax at 70% 10%,var(--neb1),transparent 70%)}
body[data-skin="space"] #sky,body[data-skin="space"] .nebula{display:block}
.burst{position:fixed;left:0;top:0;width:var(--d,100px);height:var(--d,100px);margin:calc(var(--d,100px) / -2) 0 0 calc(var(--d,100px) / -2);border-radius:50%;pointer-events:none;z-index:0;opacity:0;
  transform:translate(var(--x,0),var(--y,0)) scale(.02);
  background:radial-gradient(circle,color-mix(in oklab,var(--bc) 22%,transparent) 0,transparent 30%,color-mix(in oklab,var(--bc) 30%,transparent) 52%,color-mix(in oklab,var(--bc) 70%,transparent) 58%,color-mix(in oklab,var(--bc) 12%,transparent) 63%,transparent 70%)}
.burst.go{animation:burst 1.5s cubic-bezier(.15,.7,.25,1)}
@keyframes burst{0%{opacity:1;transform:translate(var(--x),var(--y)) scale(.03)}70%{opacity:.7}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
@media (prefers-reduced-motion:reduce){.burst.go{animation:burstR .8s ease}@keyframes burstR{0%,100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.5)}30%{opacity:.6;transform:translate(var(--x),var(--y)) scale(.5)}}}
.wrap{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* header */
.top{flex:none;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"brand tabs tools";align-items:center;gap:10px 28px;padding:16px 22px 6px;width:100%;max-width:1120px;margin:0 auto}
.brand{grid-area:brand}.tabs{grid-area:tabs;justify-self:center}.tools{grid-area:tools;display:flex;align-items:center;gap:2px;justify-self:end;margin-right:-6px}
@media (max-width:1040px){.top{grid-template-columns:auto 1fr;grid-template-areas:"brand tools" "tabs tabs";padding:8px 16px 2px;row-gap:2px}.tabs{justify-self:stretch;justify-content:center}}
.icon{display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:12px;padding:6px 2px;min-width:44px;min-height:44px}
.sheet-head .icon{min-width:0;padding:6px 0 6px 12px}
.icon:hover{color:var(--ink)}
.icon svg{width:18px;height:18px;flex:none}
body[data-skin="radio"] .icon{font-family:var(--fd);font-size:18px}
.brand{font-family:var(--fd);font-weight:500;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand svg{width:20px;height:20px;align-self:center}
body[data-skin="space"] .brand{font-weight:300;letter-spacing:.32em;font-size:13px;text-transform:uppercase}
body[data-skin="radio"] .brand{font-size:24px;letter-spacing:.04em}
.tabs{display:flex;flex-wrap:nowrap;justify-content:safe center;gap:4px 22px;max-width:100%;min-width:0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;font-size:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs .s{display:none}
.tabs button{position:relative;color:var(--muted);font-size:inherit;padding:10px 0;white-space:nowrap;transition:color .2s;flex:none}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--orange)}
body[data-skin="space"] .tabs button[aria-selected="true"]{text-shadow:0 0 14px color-mix(in oklab,var(--blue) 70%,transparent)}
body[data-skin="radio"] .tabs{font-family:var(--fd);font-size:21px}
.skin{display:flex;gap:14px;margin-left:auto}
.skin button{color:var(--muted);font-size:13px}
.skin button[aria-pressed="true"]{color:var(--orange)}
body[data-skin="radio"] .skin button{font-family:var(--fd);font-size:19px}
.score{font-size:12px;color:var(--muted);white-space:nowrap;letter-spacing:.02em;margin-right:6px}
.score b{font-weight:500;color:var(--ink)}
@media (max-width:520px){.score .long{display:none}}
@media (max-width:350px){.icon{min-width:40px}.score{margin-right:2px}}
body[data-skin="radio"] .score{font-family:var(--fd);font-size:18px}

.layout{flex:1;min-height:0;display:flex;justify-content:center;overflow:hidden}
.stage{container-type:size;flex:1;min-width:0;min-height:460px;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:2px 8px 10px;
  --res:226px;--fw:max(210px,min(460px,calc(100cqw - 16px),calc(100cqh - var(--res))))}
body[data-mode="key"] .stage{--res:232px;--fw:max(210px,min(440px,calc(100cqw - 44px),calc(100cqh - var(--res))))}
body[data-skin="radio"] .stage{--res:372px;--fw:max(200px,min(460px,calc(100cqw - 44px),calc(100cqh - var(--res))))}
body[data-skin="radio"][data-mode="key"] .stage{--res:420px}
body.focusing .stage{--res:250px}body.focusing[data-skin="radio"] .stage{--res:420px}
.device{display:flex;flex-direction:column;align-items:center;max-width:100%}
body[data-skin="space"] .device{height:100%;width:100%}
body[data-skin="space"] .field{margin-top:auto;margin-bottom:auto}

/* radio device */
body[data-skin="radio"] .device{width:calc(var(--fw) + 36px);max-width:100%;border-radius:30px;padding:14px 18px 0;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in oklab,var(--panel) 80%,#fff) 0%,var(--panel) 18%,var(--panel) 70%,color-mix(in oklab,var(--panel) 86%,#000) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 8px rgba(0,0,0,.14),0 7px 0 color-mix(in oklab,var(--panel) 62%,#000),0 22px 38px rgba(0,0,0,.32)}
body[data-skin="radio"] .feedback,body[data-skin="radio"] .keyui{width:100%}
body[data-skin="radio"] .controls{gap:16px}
body[data-skin="radio"] .field::before{content:"";position:absolute;inset:3%;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,color-mix(in oklab,var(--panel) 70%,#fff) 0%,var(--panel2) 55%,color-mix(in oklab,var(--panel2) 80%,#000) 100%);
  box-shadow:0 10px 18px rgba(0,0,0,.28),0 3px 0 color-mix(in oklab,var(--panel2) 60%,#000),inset 0 2px 1px rgba(255,255,255,.5),inset 0 -6px 10px rgba(0,0,0,.12)}
body[data-skin="radio"] .chip{text-shadow:0 1px 0 rgba(255,255,255,.45),0 -1px 0 rgba(0,0,0,.18)}
body[data-skin="radio"] .rings .grille{fill:color-mix(in oklab,var(--panel2) 85%,#000);filter:drop-shadow(0 -.4px 0 rgba(0,0,0,.25))}
@supports (corner-shape:squircle){body[data-skin="radio"] .device{corner-shape:squircle;border-radius:64px}}
.plate{display:none;width:100%;justify-content:space-between;align-items:center;font-family:var(--fd);font-size:17px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.plate .leds{display:flex;gap:6px;align-items:center}
.plate .leds i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.plate .leds i.on{background:var(--orange);box-shadow:0 0 6px var(--orange)}
body[data-skin="radio"] .plate{display:flex}
.grille{display:none;width:calc(100% + 40px);height:34px;margin:10px -20px 0;flex:none;background-color:var(--panel2);
  background-image:radial-gradient(circle at 50% 40%,color-mix(in oklab,var(--ink) 55%,transparent) 1.6px,rgba(255,255,255,.25) 2.2px,transparent 2.6px);background-size:9px 9px;border-top:1px solid var(--line);
  box-shadow:inset 0 6px 10px rgba(0,0,0,.18)}
body[data-skin="radio"] .grille{display:block}

.screen{display:none;position:relative;width:100%;height:62px;background:var(--screen);border-radius:12px;overflow:hidden;flex:none;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 10px 22px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.5),0 -1px 0 rgba(0,0,0,.15)}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22) 2px 3px)}
body[data-skin="radio"] .screen{display:block}
.screen canvas{position:absolute;inset:0;width:100%;height:100%}
.screen .read{position:absolute;top:6px;left:12px;right:12px;display:flex;justify-content:space-between;font-family:"VT323",monospace;font-size:19px;color:var(--lcd);pointer-events:none;z-index:1;text-shadow:0 0 6px color-mix(in oklab,var(--lcd) 60%,transparent)}
.screen.blink-good{animation:blinkG .95s steps(1)}
.screen.blink-bad{animation:blinkB .95s steps(1)}
@keyframes blinkG{0%,32%,64%{background:var(--blue)}16%,48%,80%,100%{background:var(--screen)}}
@keyframes blinkB{0%,32%,64%{background:var(--orange)}16%,48%,80%,100%{background:var(--screen)}}
@media (prefers-reduced-motion:reduce){.screen.blink-good{animation:none;background:color-mix(in oklab,var(--blue) 45%,var(--screen))}.screen.blink-bad{animation:none;background:color-mix(in oklab,var(--orange) 45%,var(--screen))}}

@media (max-height:720px) and (orientation:portrait){
  .feedback{height:104px}
  body[data-skin="radio"] .screen{height:48px}
  body[data-skin="radio"] .grille{height:22px;margin-top:6px}
  body[data-skin="radio"] .stage{--res:312px}
  body[data-skin="radio"][data-mode="key"] .stage{--res:402px;--fw:max(150px,min(460px,calc(100cqw - 44px),calc(100cqh - var(--res))))}
}
@media (max-height:620px) and (orientation:portrait){
  body[data-skin="radio"] .plate{display:none}
  body[data-skin="radio"] .stage{--res:300px;--fw:max(150px,min(460px,calc(100cqw - 44px),calc(100cqh - var(--res))))}
  body[data-skin="radio"][data-mode="key"] .stage{--res:368px}
  .piano{height:84px}.feedback{height:96px}
  body[data-skin="radio"][data-mode="key"] .screen{height:38px}body[data-skin="radio"][data-mode="key"] .piano{height:70px}body[data-skin="radio"][data-mode="key"] .keyui{gap:6px}
}
/* field */
.field{position:relative;width:var(--fw);aspect-ratio:1;margin:12px 0 10px;container-type:inline-size;flex:none}
body[data-skin="radio"] .field{margin:14px 0 8px}
.field svg.rings,.field canvas.orbit{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.field canvas.orbit{display:none;inset:-10%;width:120%;height:120%}
body[data-skin="space"] .field canvas.orbit{display:block}
.rings .track{fill:none;stroke:var(--line);stroke-width:.3}
.rings .outer{fill:none;stroke:var(--ink);stroke-opacity:.5;stroke-width:.5}
.rings .orbit-dash{fill:none;stroke:var(--blue);stroke-opacity:.4;stroke-width:.2;stroke-dasharray:.4 1.6}
.rings .tickm{stroke:var(--muted);stroke-width:.3}
.rings .tickM{stroke:var(--ink);stroke-width:.6}
.rings .deg{fill:var(--muted);font-size:2.8px;font-family:var(--fb);opacity:.8}
.rings .dust{fill:var(--star)}
.rings .grille{fill:var(--panel2)}
.rings .knurl{fill:none;stroke:var(--ink);stroke-opacity:.18;stroke-width:2;stroke-dasharray:.5 .9}
body[data-skin="space"] .radio-only,body[data-skin="radio"] .space-only{display:none}

.indicator{position:absolute;inset:0;pointer-events:none;transform:rotate(var(--a,0deg));transition:transform .7s cubic-bezier(.3,1.35,.5,1),opacity .3s;opacity:0}
.indicator.on{opacity:1}
.indicator{--ic:var(--orange)}
body[data-skin="space"] .indicator::after{content:"";position:absolute;left:50%;top:4%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ic);box-shadow:0 0 16px 5px color-mix(in oklab,var(--ic) 55%,transparent)}
body[data-skin="radio"] .indicator::after{content:"";position:absolute;left:50%;top:1%;width:3px;height:9%;margin-left:-1.5px;background:var(--ic);border-radius:1px}
@media (prefers-reduced-motion:reduce){.indicator{transition:none}}

.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40%;max-height:40%;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:1}
.keyname{font-family:var(--fd);font-size:clamp(13px,5.4cqi,21px);font-weight:500;letter-spacing:.01em;line-height:1.2}
body[data-skin="space"] .keyname{font-weight:300;color:#F2F5FF;text-shadow:0 0 18px rgba(255,170,100,.45)}
body[data-skin="space"] .center .prompt{color:rgba(225,232,250,.72)}
body[data-skin="space"] .center .slot{color:#EAF0FF;border-color:rgba(225,232,250,.35)}
body[data-skin="space"] .center .slot.filled{border-color:#EAF0FF}
body[data-skin="space"] .center .slot.ok{color:var(--blue);border-color:var(--blue)}
body[data-skin="space"] .center .slot.no{color:var(--orange);border-color:var(--orange)}
body[data-skin="space"] .ktitle,body[data-skin="space"] .kplay{color:#F2F5FF}
body[data-skin="space"] .kcenter{width:54%;gap:4px}
body[data-skin="space"] .kmeta{flex-direction:column;gap:2px}
body[data-skin="space"] .ksub,body[data-skin="space"] .kmeta{color:rgba(225,232,250,.7)}
body[data-skin="radio"] .keyname{font-size:clamp(20px,7.6cqi,30px)}
.prompt{font-size:clamp(12px,3.5cqi,14px);color:var(--muted);line-height:1.3;max-width:100%;overflow-wrap:break-word}
body[data-skin="radio"] .prompt{font-size:13px}
.slots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.slot{min-width:26px;padding:2px 2px 3px;border-bottom:1.5px solid var(--faint);font-family:var(--fc);font-size:14px;font-weight:500;text-align:center}
body[data-skin="radio"] .slot{font-size:19px}
.slot.filled{border-color:var(--ink)} .slot.ok{border-color:var(--blue);color:var(--blue)} .slot.no{border-color:var(--orange);color:var(--orange)}

.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:0;align-items:center;z-index:2}
.chip{font-family:var(--fc);font-size:clamp(11px,3.6cqi,15px);font-weight:500;color:var(--ink);padding:5px 6px;min-width:44px;min-height:32px;line-height:1.2;transition:color .2s,text-shadow .2s,transform .1s}
.chip.chrom{color:color-mix(in oklab,var(--ink) 62%,var(--muted))} .chip.home{font-weight:700}
.chip.big,.chip.deg{font-size:clamp(15px,5.2cqi,22px);min-height:44px}
/* a soft halo in the background color lifts labels off the stars and the glow */
body[data-skin="space"] .chip{font-weight:600;text-shadow:0 0 3px var(--bg),0 0 8px var(--bg),0 0 14px var(--bg)}
body[data-skin="space"] .chip.chrom{font-weight:500}
.dl{font-size:clamp(8px,2.3cqi,10px);color:var(--faint);line-height:1;margin-bottom:1px;font-family:var(--fb)}
.chip:active{transform:scale(.92)}
@media (hover:hover){body[data-skin="space"] .chip:hover{color:var(--blue);text-shadow:0 0 14px var(--blue)}}
body[data-skin="radio"] .chip{font-size:clamp(17px,6cqi,24px);padding:1px 5px;min-height:28px}
body[data-skin="radio"] .chip.big,body[data-skin="radio"] .chip.deg{min-height:44px}
body[data-skin="radio"] .chip.big,body[data-skin="radio"] .chip.deg{font-size:clamp(21px,8cqi,32px)}
@media (hover:hover){body[data-skin="radio"] .chip:hover{color:var(--orange)}}
.chip.is-answer{color:var(--blue)!important}
body[data-skin="space"] .chip.is-answer{text-shadow:0 0 16px var(--blue)}
body[data-skin="radio"] .chip.is-answer{text-decoration:underline 2px;text-underline-offset:4px}
.chip.is-wrong{color:var(--orange)!important;text-decoration:line-through 1.5px}
.chip.flash{color:var(--orange)!important}
.ghost{width:3px;height:3px;border-radius:50%;background:var(--faint)}

/* text buttons */
.controls{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:baseline}
.tbtn{color:var(--muted);font-size:14px;padding:10px 4px;min-height:44px;letter-spacing:.01em;transition:color .2s}
.tbtn:hover{color:var(--ink)}
.tbtn.primary{color:var(--ink);font-family:var(--fd);font-size:15px}

// harmonic function of each chord, used to build progressions that move the way real music does
const FN={maj:{0:'T',4:'t',9:'t',3:'t',2:'P',5:'P',8:'P',7:'D',11:'D',10:'D'},min:{0:'T',3:'t',8:'P',2:'P',5:'P',1:'P',7:'D',11:'D',10:'D'}};
const SECT={VofV:7,VofVI:9,VofII:2,V7ofIV:5};
const fnOf=(c,ton)=>c.g==='sec'?'S':FN[ton][c.off]||'t';
function moves(a,b,ton){const fa=fnOf(a,ton),fb=fnOf(b,ton);
  if(fa==='S')return b.off===SECT[a.id]&&fb!=='S';
  if(fb==='S')return fa!=='D';
  return {T:'tPD',t:'tPD',P:'PDT',D:'Tt'}[fa].includes(fb);}
function buildProg(p,ton,len){
  const out=[];
  for(let i=0;i<len;i++){
    const prev=out[i-1];let cand=p.filter(c=>c.id!=='m:I'||i===len-1);if(!cand.length)cand=p;
    if(S.prog!=='random'&&len>1){
      const good=prev?cand.filter(c=>c.id!==prev.id&&moves(prev,c,ton)):cand.filter(c=>fnOf(c,ton)==='T');
      if(good.length&&Math.random()<(prev?.85:.6))cand=good;
    }
    out.push(pickWeighted(cand,x=>x.id,STATS.ctx,prev?prev.id:last.ctx));
  }
  last.ctx=out[out.length-1].id;return out;
}
function newContext(){
  const f=focusList('context');let ton,p;
  if(f){ton=CHORD_TON(f[rnd(f.length)]);p=f.filter(id=>CHORD_TON(id)===ton).map(id=>BYID[id]);}
  else{ton=chooseTon();p=pool(ton);}
  if(!p.length){setPrompt(`Turn on at least one ${tonWord(ton)}-key chord group in Settings.`);return false;}
  const key=chooseKey(),items=buildProg(p,ton,S.len).map(c=>({chord:c,inv:S.inv?rnd(QUAL[c.q].iv.length):0}));
  Q={mode:'context',ton,key,items,answers:[],graded:false,nameDone:false};Q.vs=voiceSeq(key,items);return true;
}
function playContext(withCad){
  ac();stopAll();ensureDrone(Q.key);let t=now()+.12;
  if(withCad)t=playVoicings(cadenceVs(Q.key,Q.ton),t,S.cadLen)+.55;

  return end-now();
}
function answerContext(id){

      <span class="namebtns"><button class="link" data-act="namecheck">Check</button><button class="link" data-act="nameskip">Show</button></span>

function playChordInKey(c,inv,thenHome){

function parseChord(str){
  const s=str.trim().replace(/\s+/g,'');const m=s.match(/^([A-Ga-g])(bb|##|b|#|♭♭|♯♯|♭|♯|𝄫|𝄪)?(.*)$/);if(!m)return null;
  const L=m[1].toUpperCase(),acc={'':0,b:-1,bb:-2,'#':1,'##':2,'♭':-1,'♭♭':-2,'♯':1,'♯♯':2,'𝄫':-2,'𝄪':2}[m[2]||''];
  const t=m[3];const Qs=[[/^([Mm]aj7|[Mm]a7|M7|Δ7?|△7?)$/,'maj7'],[/^(m7b5|m7♭5|-7b5|ø7?|hd7?)$/,'hd7'],[/^(dim7|°7|o7)$/,'dim7'],[/^(m7|min7|-7)$/,'m7'],
    [/^(7|dom7)$/,'dom7'],[/^(dim|°|o)$/,'dim'],[/^(aug|\+)$/,'aug'],[/^(m|min|-)$/,'min'],[/^([Mm]aj|M)?$/,'maj']];
  const q=(Qs.find(([r])=>r.test(t))||[])[1];if(!q)return null;
  return {letter:L,pc:(NAT[LETTERS.indexOf(L)]+acc+12)%12,q};
}
function checkName(){
  if(!Q||Q.nameDone)return;const v=$('#nameIn').value,p=parseChord(v),msg=$('#nameMsg'),mk=$('#nameLine .fb-mark');
  if(!p){msg.textContent='I couldn’t read that. Try something like E♭, F♯m or Bb7.';return;}
  const c=Q.items[0].chord,L=LETTERS[(KL[Q.ton][Q.key]+c.st)%7],pc=(Q.key+c.off)%12,right=chordName(Q.key,Q.ton,c);
  const ok=p.q===c.q&&p.pc===pc;Q.nameDone=true;
  mk.className='fb-mark '+(ok?'ok':'no');mk.textContent=ok?'✓':'✗';
  if(ok&&p.letter===L)msg.innerHTML=`Yes, <b>${right}</b>.`;
  else if(ok)msg.innerHTML=`Right sound. In this key it’s spelled <b>${right}</b>.`;
  else if(p.pc===pc)msg.innerHTML=`Right root, wrong quality. It’s <b>${right}</b>.`;
  else msg.innerHTML=`Not quite. It’s <b>${right}</b>.`;
  fx(ok);
}

/* ================= Find the key (songs) ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const TEMPL={
  maj:{1:[['I','IV','V','I'],['I','V','IV','I']],2:[['I','vi','IV','V'],['I','IV','vi','V']],3:[['vi','IV','I','V'],['IV','I','V','vi']],4:[['IV','V','iii','vi'],['ii','V','iii','vi']],5:[['IV','vi','V','IV'],['ii','IV','V','IV']]},
  min:{1:[['m:i','m:iv','m:V','m:i'],['m:i','m:VI','m:V','m:i']],2:[['m:i','m:VI','m:III','m:VII'],['m:i','m:iv','m:VII','m:i']],3:[['m:VI','m:VII','m:i','m:i'],['m:i','m:VII','m:VI','m:V']],4:[['m:VI','m:III','m:VII','m:iv'],['m:iv','m:VI','m:VII','m:i']],5:[['m:III','m:VII','m:iv','m:VI'],['m:VI','m:iv','m:III','m:VII']]}
};
const STYLES={drift:'Drift',pulse:'Pulse',waltz:'Lullaby',ballad:'Ballad'};
const SONGS=(()=>{const out=[],count={};for(let i=0;i<24;i++){
  const r=mulberry(4242+i*97),ton=i%2?'min':'maj',diff=Math.min(5,1+Math.floor(i/5));
  const opts=TEMPL[ton][diff],prog=opts[Math.floor(r()*opts.length)],key=Math.floor(r()*12);
  const sk=Object.keys(STYLES),style=sk[Math.floor(r()*sk.length)];count[style]=(count[style]||0)+1;
  const bpm=style==='drift'?62+Math.floor(r()*16):style==='waltz'?84+Math.floor(r()*20):80+Math.floor(r()*36);
  const beats=style==='waltz'?3:4,sc=SCALE[ton];
  const items=prog.map(id=>({chord:BYID[id],inv:diff>=3?Math.floor(r()*3):0}));
  const mel=prog.map((id,bi)=>{const c=BYID[id],ct=QUAL[c.q].iv.map(x=>(c.off+x)%12);
    const pat=style==='drift'?[[0,2],[2,2]]:style==='waltz'?[[0,2],[2,1]]:(r()<.5?[[0,1],[1,1],[2,2]]:[[0,1.5],[1.5,.5],[2,1],[3,1]]);
    return pat.map(([beat,len],k)=>{let pc=k===0?ct[Math.floor(r()*ct.length)]:sc[Math.floor(r()*sc.length)];if(diff>=4&&bi===prog.length-1&&pc===0)pc=ct[1];return {beat,len,rel:pc};});});
  out.push({id:'s'+i,name:`${STYLES[style]} #${count[style]}`,ton,diff,prog,key,style,bpm,beats,items,mel});}
  return out;})();
// each visit to a song moves it to a new key, so passed songs stay real practice
function kState(idx){const s=SONGS[idx];let key=s.key;if(S.kKey==='random'){key=rnd(12);if(K&&K.key===key)key=(key+1+rnd(11))%12;}
  return {idx,key,sel:null,ton:null,solved:false,revealed:false,wrong:false};}
let K={idx:0,key:0,sel:null,ton:null,solved:false,revealed:false,wrong:false};
let song={playing:false,bus:null,next:0,timer:null};
const songBpm=s=>s.bpm*(S.kTempo||1);
function songStart(){
  ac();stopAll();stopDrone();if(song.timer)clearInterval(song.timer);if(song.bus)fadeKill(song.bus);
  song.bus=ctx.createGain();song.bus.connect(master);song.playing=true;song.next=now()+.12;
  const s=SONGS[K.idx];song.vs=voiceSeq(K.key,s.items);
  const sched=()=>{if(song.next<now())song.next=now()+.05;while(song.playing&&song.next<now()+1.2){scheduleLoop(s,song.next);song.next+=s.prog.length*s.beats*60/songBpm(s);}};
  sched();song.timer=setInterval(sched,250);renderKeyCenter();
}
function songStop(){song.playing=false;if(song.timer){clearInterval(song.timer);song.timer=null;}if(song.bus){fadeKill(song.bus);song.bus=null;}renderKeyCenter();}
function scheduleLoop(s,t0){
  const b=song.bus,spb=60/songBpm(s),bar=spb*s.beats,vs=song.vs;
  s.prog.forEach((id,bi)=>{const t=t0+bi*bar,v=vs[bi];
    if(s.style==='drift'){v.upper.forEach(m=>tone(b,m,t,bar*.97,.055));tone(b,v.bass,t,bar*.97,.09);}
    else if(s.style==='pulse'){const arp=[...v.upper,v.upper[1]];for(let e=0;e<8;e++){tone(b,arp[e%arp.length]+(e>=4?12:0),t+e*spb/2,spb*.45,.05);if(e%2)hat(b,t+e*spb/2,.035);}
      [0,2].forEach(x=>{tone(b,v.bass,t+x*spb,spb*1.8,.12);kick(b,t+x*spb,.22);});}
    else if(s.style==='waltz'){tone(b,v.bass,t,spb*.9,.12);[1,2].forEach(x=>v.upper.forEach(m=>tone(b,m,t+x*spb,spb*.75,.045)));}
    else {for(let x=0;x<4;x++)v.upper.forEach(m=>tone(b,m,t+x*spb,spb*.9,.04));[0,2].forEach(x=>tone(b,v.bass,t+x*spb,spb*1.9,.11));}
    s.mel[bi].forEach(n=>{const m=67+((K.key+n.rel-7)%12+12)%12;tone(b,m,t+n.beat*spb,n.len*spb*.95,.075);});
  });
}
const PLAYICON='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>';
const PAUSEICON='<svg viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"/></svg>';
function renderKeyCenter(){
  const s=SONGS[K.idx];
  $('#kPlay').innerHTML=song.playing?PAUSEICON:PLAYICON;$('#kPlay').setAttribute('aria-label',song.playing?'Pause':'Play');

  $('#kSub').textContent=(K.solved||K.revealed)?`${keyName(K.key,s.ton)} ${tonWord(s.ton)}`:`${K.idx+1}/${SONGS.length}${pick}`;

function renderPiano(){
  const s=SONGS[K.idx],white=[0,2,4,5,7,9,11],black=[[1,1],[3,2],[6,4],[8,5],[10,6]];
  const ans=pc=>(K.revealed||K.solved)&&pc===K.key?' ans':'';
  let h=white.map(pc=>`<button class="wk sq${K.sel===pc?' sel':''}${ans(pc)}" data-pc="${pc}">${FLATNAMES[pc]}</button>`).join('');
  h+=black.map(([pc,i])=>`<button class="bk sq${K.sel===pc?' sel':''}${ans(pc)}" data-pc="${pc}" style="left:calc(${i*100/7}% - 4.5%)">${FLATNAMES[pc]}</button>`).join('');
  $('#piano').innerHTML=h;
  document.querySelectorAll('#kTon button').forEach(b=>{b.setAttribute('aria-pressed',K.ton===b.dataset.v);b.classList.toggle('reveal',(K.revealed||K.solved)&&b.dataset.v===s.ton);});
  const ck=$('#kCheck');ck.classList.toggle('ok',K.solved);ck.classList.toggle('no',K.wrong&&!K.solved);

  $('#kDots').innerHTML=SONGS.map((x,i)=>{const a=i*360/SONGS.length*Math.PI/180;return `<button class="${STATS.key.passed[x.id]?'pass':''}${i===K.idx?' cur':''}${kAllowed(i)?'':' off'}" data-i="${i}" aria-label="Song ${i+1}" title="${x.name}" style="left:${50+47*Math.sin(a)}%;top:${50-47*Math.cos(a)}%"></button>`;}).join('');
}
let holds={};
function holdStart(pc,id){
  ac();if(holds[id])return;const b=ctx.createGain();b.connect(master);const t=now()+.01;
  tone(b,60+pc,t,6,.13);tone(b,48+pc,t,6,.07);holds[id]=b;

}
// testing a note never changes the answer; a double-tap (or pressing a key twice) chooses home
let lastTap={pc:null,t:0};
function kTap(pc){const t=performance.now();if(lastTap.pc===pc&&t-lastTap.t<450){lastTap={pc:null,t:0};kPick(pc);}else lastTap={pc,t};}
function kPick(pc){if(K.solved)return;K.sel=pc;K.wrong=false;
  document.querySelectorAll('#piano [data-pc]').forEach(el=>el.classList.toggle('sel',+el.dataset.pc===pc));
  const ck=$('#kCheck');ck.classList.remove('no');renderKeyCenter();}
const kAllowed=i=>{const d=SONGS[i].diff;return S.kDiff==='easy'?d<=2:S.kDiff==='mid'?d===3:S.kDiff==='hard'?d>=4:true;};
function kRandom(){const ok=SONGS.map((_,i)=>i).filter(i=>kAllowed(i)&&i!==K.idx);if(ok.length)kGo(ok[rnd(ok.length)]);}
function holdEnd(id){const b=holds[id];if(!b)return;delete holds[id];const t=now();b.gain.setTargetAtTime(0,t,.12);setTimeout(()=>b.disconnect(),900);document.querySelectorAll('#piano .down').forEach(e=>e.classList.remove('down'));}
function kSetTon(t){if(K.solved)return;K.ton=t;K.wrong=false;renderPiano();renderKeyCenter();}
function kCheck(){
  const s=SONGS[K.idx];if(K.solved)return kGo(K.idx+1);
  if(K.sel==null||!K.ton){$('#kSub').textContent=K.sel==null?'Double-tap home':'maj or min?';return;}
  STATS.key.att++;const ok=K.sel===K.key&&K.ton===s.ton;
  if(ok){K.solved=true;if(!K.revealed)STATS.key.passed[s.id]=true;}else K.wrong=true;

}
function kReveal(){K.revealed=true;renderPiano();renderKeyCenter();}
function kGo(i,step=1){const was=song.playing,N=SONGS.length;songStop();let j=(i%N+N)%N;for(let n=0;n<N&&!kAllowed(j);n++)j=(j+step+N)%N;
  K=kState(j);S.song=K.idx;saveS();renderPiano();renderKeyCenter();if(was)songStart();}

/* ================= Main flow ================= */
function nextQuestion(){
  $('#feedback').innerHTML='';setIndicator(null);setPrompt('');
  if(S.mode==='intervals'){newInterval();setKeyName(DIRW[Q.dir]);renderNodes();playInterval(Q.root,Q.second,Q.dir);setPrompt('');}
  else if(S.mode==='degrees'){newDegree();setKeyName(`${keyName(Q.key,Q.ton)} ${tonWord(Q.ton)}`);renderNodes();playDegree(S.cadence);}
  else if(S.mode==='quality'){if(!newQuality())return;setKeyName('?');renderNodes();playQualityChord(Q.target,Q.root);setPrompt('');}
  else if(S.mode==='context'){if(!newContext())return;setKeyName(`${keyName(Q.key,Q.ton)} ${tonWord(Q.ton)}`);renderNodes();playContext(S.cadence);}
  renderSlots();markChips();updateButtons();
}
function mainAction(){
  if(pocket)return; if(S.mode==='key')return song.playing?songStop():songStart();
  if(session.done&&(!Q||Q.graded))return newSessionStart();
  if(!Q||Q.graded)return nextQuestion();
  replay();
}
function setMode(m){
  if(pocket)togglePocket();stopAll();songStop();if(m==='quality'||m==='key'||m==='intervals')stopDrone();
  if(S.mode!==m||focus){focus=null;renderFocus();session=newSession();}
  S.mode=m;saveS();Q=null;document.body.dataset.mode=m;setIndicator(null);updateScore();
  document.querySelectorAll('.tabs button').forEach(b=>{const on=b.dataset.mode===m;b.setAttribute('aria-selected',on);if(on)try{b.scrollIntoView({inline:'nearest',block:'nearest'})}catch(e){}});
  $('#feedback').innerHTML='';
  const isKey=m==='key';
  $('#keyCenter').hidden=!isKey;$('#keyUI').hidden=!isKey;$('#kDots').hidden=!isKey;$('#stdCenter').hidden=isKey;$('#stdControls').hidden=isKey;
  if(isKey){K=kState(S.song||0);if(!kAllowed(K.idx))kGo(K.idx);renderPiano();renderKeyCenter();}
  else{setKeyName('');setPrompt('');$('#readR').textContent=m.toUpperCase();
    if(!store.get('tf2.seen',false))$('#feedback').innerHTML=`<div class="fb-line"><span class="fb-mark"></span><span class="fb-text">Tap ▶ to listen, then tap your answer on the circle.</span></div>`;}
  renderNodes();renderSlots();updateButtons();renderSettings();renderStats();
}

function say(text){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
let wake=null;
async function keepAwake(on){try{if(on){if(navigator.wakeLock&&!wake&&!document.hidden){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}else if(wake){const w=wake;wake=null;await w.release();}}catch(e){wake=null;}}
function togglePocket(){
  pocket=!pocket;const b=$('#btnPocket');if(b){b.textContent=pocket?'Stop':'Start';b.classList.toggle('on',pocket);}
  // iOS only lets a page speak after a tap: say nothing now, so the timed answers later are allowed
  if(pocket){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}ac();pocketStep();}
  else{stopAll();try{speechSynthesis.cancel()}catch(e){}setPrompt('');}
  keepAwake(pocket);updateButtons();
}
function pocketStep(){
  if(!pocket)return;$('#feedback').innerHTML='';setIndicator(null);
  if(S.mode==='intervals'){newInterval();setKeyName(DIRW[Q.dir]);renderNodes();
    const d=playInterval(Q.root,Q.second,Q.dir);setPrompt('…');
    later(d+2.5,()=>{if(!pocket)return;say(INTSPK[Q.target]+(Q.dir==='down'?', down':''));setIndicator(Q.target*30,true);flashChip(Q.target);showResult(INT[Q.target],true);
      later(.9,()=>{if(!pocket)return;const d2=playInterval(Q.root,Q.second,Q.dir);later(d2+1.4,pocketStep);});});
  } else if(S.mode==='degrees'&&(S.notes||1)>1){newDegree();setKeyName(`${keyName(Q.key,Q.ton)} ${tonWord(Q.ton)}`);renderNodes();renderSlots();
    const d=playDegree(S.cadence);setPrompt('…');
    later(d+3.5,()=>{if(!pocket)return;say(Q.items.map(it=>DEGSPK[it.pos]).join(', '));showResult(Q.items.map(it=>DEG[it.pos]).join(' '),true);
      setIndicator(Q.items[Q.items.length-1].pos*30,true);const end=playDegreeSeq(now()+1.2);later(end-now()+1.6,pocketStep);});
  } else if(S.mode==='degrees'){newDegree();setKeyName(`${keyName(Q.key,Q.ton)} ${tonWord(Q.ton)}`);renderNodes();
    const d=playDegree(S.cadence);setPrompt('…');
    later(d+3,()=>{if(!pocket)return;say(DEGSPK[Q.target]);setIndicator(Q.target*30,true);flashChip(Q.target);showResult(DEG[Q.target],true);
      later(.8,()=>{if(!pocket)return;const b=bus();let t=now()+.05;const base=Q.midi-Q.target;resolvePath(Q.target,Q.ton).forEach((p,i,a)=>{const L=i===a.length-1?1:.4;tone(b,base+p,t,L,.14);t+=L;});later(t-now()+1.4,pocketStep);});});
  } else {
    if(!newContext()){togglePocket();return;}setKeyName(`${keyName(Q.key,Q.ton)} ${tonWord(Q.ton)}`);renderNodes();renderSlots();
    const d=playContext(S.cadence);setPrompt('…');
    later(d+3.5,()=>{if(!pocket)return;say(Q.items.map(i=>i.chord.spk).join(', '));showResult(Q.items.map(i=>i.chord.lab).join(' '),true);
      setIndicator(Q.items[Q.items.length-1].chord.off*30,true);
      const end=playVoicings(Q.vs,now()+.9,S.tempo);later(end-now()+1.6,pocketStep);});
  }
}

/* ================= Stats ================= */
function statRows(bucket,labelOf){
  const rows=Object.entries(bucket).filter(([,s])=>s.n>0).map(([id,s])=>({id,s,acc:recentAcc(s)})).sort((a,b)=>a.acc-b.acc);
  if(!rows.length)return '<p class="empty">No answers yet in this mode.</p>';
  return rows.map(({id,s,acc})=>{const top=Object.entries(s.conf||{}).sort((a,b)=>b[1]-a[1])[0];
    return `<div class="stat"><b>${labelOf(id)}</b><span class="bar"><i style="width:${Math.round(acc*100)}%"></i></span><span class="meta">${Math.round(acc*100)}% ${s.h&&s.h.length>=3&&s.n>s.h.length?`lately (${s.n} total)`:`of ${s.n}`}${top?`; mixed up with ${labelOf(top[0])} ×${top[1]}`:''}</span></div>`;}).join('')
    +'<p class="empty">Weaker items come up more often.</p>';
}
function renderStats(){
  const el=$('#stats'),w=$('#weak');
  if(S.mode==='key')w.innerHTML='';
  else{const ids=weakIds(S.mode);w.innerHTML=ids.length?`<button class="link" id="btnWeak">Practice my weak spots: ${ids.map(LABEL[S.mode]).join(' · ')}</button>`:`<p class="empty">Answer a few more questions and your weak spots will show up here.</p>`;}
  if(S.mode==='intervals')el.innerHTML=statRows(STATS.int,id=>INT[+id]);
  else if(S.mode==='degrees')el.innerHTML=statRows(STATS.deg,id=>{const[t,p]=id.split(':');return `${DEG[+p]} <small style="color:var(--muted);font-weight:400">${t==='min'?'min':'maj'}</small>`;});
  else if(S.mode==='quality')el.innerHTML=statRows(STATS.qual,id=>(QLIST.find(q=>q.id===id)||{lab:id}).lab);
  else if(S.mode==='context')el.innerHTML=statRows(STATS.ctx,id=>BYID[id]?`${BYID[id].lab}${CHORD_TON(id)==='min'?' <small style="color:var(--muted);font-weight:400">min</small>':''}`:id);
  else{const p=Object.keys(STATS.key.passed).length;el.innerHTML=`<p class="empty">${p} of ${SONGS.length} songs passed, ${STATS.key.att} checks so far.</p>`;}
}

const rowChk=(label,prop,sub='')=>`<div class="row"><label for="c_${prop}">${label}${sub?`<small>${sub}</small>`:''}</label><input type="checkbox" id="c_${prop}" data-chk="${prop}" ${S[prop]?'checked':''}></div>`;
const rowRange=(label,prop,min,max,step,sub='')=>`<div class="row"><label for="r_${prop}">${label}${sub?`<small>${sub}</small>`:''}</label><input type="range" id="r_${prop}" data-range="${prop}" min="${min}" max="${max}" step="${step}" value="${S[prop]}"></div>`;
const keySelect=()=>`<div class="row"><label for="sKey">Key</label><select id="sKey"><option value="random">Random each question</option>${[...Array(12)].map((_,pc)=>`<option value="${pc}" ${String(S.key)===String(pc)?'selected':''}>${FLATNAMES[pc]}</option>`).join('')}</select></div>`;
const gt=t=>`<div class="gt">${t}</div>`;
const MODE_NAME={intervals:'Intervals',degrees:'Degrees',quality:'Chord quality',context:'Chords in a key',key:'Find the key'};
const pocketRow=()=>gt('Hands-free')+`<div class="row"><label>Pocket mode<small>Plays, waits, then says the answer aloud</small></label><button class="link${pocket?' on':''}" id="btnPocket">${pocket?'Stop':'Start'}</button></div>`;

  const cadRows=rowChk('Cadence first','cadence','Plays I–IV–V–I (or i–iv–V–i) to set the key')+rowRange('Cadence chord length','cadLen',.35,1.8,.05);
  if(m==='intervals'){
    h+=rowSeg('Intervals','intSet',[['perfect','P4 P5 P8'],['major','Major scale'],['all','All 12']])+rowSeg('Direction','intDir',[['up','Up'],['down','Down'],['mix','Both'],['harm','Together']],'Together plays both notes at once');
    h+=pocketRow();
  } else if(m==='degrees'){
    h+=tonRow+keySelect()+rowSeg('Notes','degSet',[['triad','1 3 5'],['scale','Scale'],['all','All 12']])+rowSeg('Range','range',[[1,'1 oct'],[2,'2 oct']]);
    h+=rowSeg('Notes per question','notes',[[1,'1'],[2,'2'],[3,'3'],[4,'4']],'More than one makes a short melody');
    h+=gt('Sound')+droneRows+cadRows+rowRange('Note length','noteLen',.5,2.5,.1);
    h+=pocketRow();
  } else if(m==='quality'){
    h+=gt('Triads')+QLIST.filter(q=>q.g==='tri').map(q=>`<div class="row"><label for="q_${q.id}">${q.lab}</label><input type="checkbox" id="q_${q.id}" data-q="${q.id}" ${S.quals[q.id]?'checked':''}></div>`).join('');
    h+=gt('Sevenths')+QLIST.filter(q=>q.g==='sev').map(q=>`<div class="row"><label for="q_${q.id}">${q.lab}</label><input type="checkbox" id="q_${q.id}" data-q="${q.id}" ${S.quals[q.id]?'checked':''}></div>`).join('');
    h+=gt('Sound')+rowSeg('Playback','qualPlay',[['block','Block'],['arp','Arpeggio'],['both','Both']])+rowRange('Chord length','qualLen',.6,2.6,.1);
  } else if(m==='context'){
    h+=tonRow+keySelect();
    const tons=S.ton==='mix'?['maj','min']:[S.ton];
    tons.forEach(t=>{h+=gt(`Chords in ${tonWord(t)} keys`)+GROUPS.filter(g=>g.ton===t).map(g=>`<div class="row"><label for="g_${g.id}">${g.t}<small>${g.s}</small></label><input type="checkbox" id="g_${g.id}" data-group="${g.id}" ${S.groups[g.id]?'checked':''}></div>`).join('');});
    h+=gt('Question')+rowSeg('Chords per question','len',[[1,'1'],[2,'2'],[3,'3'],[4,'4']])+rowSeg('Progressions','prog',[['musical','Musical'],['random','Random']],'Musical moves like real songs; random is harder')+rowChk('Inversions','inv','Bass may be the 3rd, 5th or 7th')+rowChk('Name the chord too','nameIt','Single-chord questions');
    h+=gt('Sound')+droneRows+cadRows+rowRange('Chord length','tempo',.6,2.4,.1)+rowChk('Louder bass','bass');
    h+=pocketRow();
  } else {
    h+=rowSeg('Difficulty','kDiff',[['all','All'],['easy','1–2'],['mid','3'],['hard','4–5']])+rowSeg('Tempo','kTempo',[[.8,'Slower'],[1,'Normal'],[1.2,'Faster']])
      +rowSeg('Key','kKey',[['random','New each time'],['orig','Fixed']],'New each time stops you memorizing songs')
      +`<div class="row"><label>Random song</label><button class="link" id="btnRandSong">Play one</button></div>`;
  }
  if(m!=='key')h+=gt('Session')+rowSeg('Length','goal',[[0,'Open'],[10,'10'],[25,'25'],[50,'50']],'Ends with a summary of what you missed')
    +rowChk('Auto-advance','auto','Next question shortly after a right answer');
  h+=gt('General')+`<div class="row"><label for="sSound">Sound</label><select id="sSound">${[['auto','Match theme'],['glass','Glass'],['sine','Sine radio'],['piano','Soft keys']].map(([v,t])=>`<option value="${v}" ${S.sound===v?'selected':''}>${t}</option>`).join('')}</select></div>`+rowRange('Volume','vol',0,1,.05)
    +(navigator.vibrate?rowChk('Vibration','buzz','A short buzz when right, a double buzz when wrong'):'');
  h+=gt('Backup')+`<p class="sub">Your progress lives on this device only. On iPhone, Safari and the home-screen app keep separate copies: copy from one, paste into the other.</p>
    <div class="backup"><button class="link" data-bk="copy">Copy progress</button><button class="link" data-bk="paste">Paste progress</button><button class="link" data-bk="save">Save file</button><button class="link" data-bk="load">Load file</button></div>
    <input type="file" id="bkFile" accept="application/json,.json,.txt" hidden><p class="sub" id="bkMsg" aria-live="polite"></p>`;
  $('#settings').innerHTML=h;
}
$('#settings').addEventListener('click',e=>{
  const sb=e.target.closest('[data-seg] button');
  if(sb){const prop=sb.parentElement.dataset.seg;let v=sb.dataset.v;if(['len','range','notes','goal','kTempo'].includes(prop))v=+v;S[prop]=v;saveS();
    sb.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===sb));
    if(prop==='ton'||prop==='degSet'||prop==='intSet'||prop==='notes'){if(!Q||Q.graded){Q=null;renderNodes();renderSlots();updateButtons();}if(prop==='ton'&&S.mode==='context')renderSettings();}
    if(prop==='goal'){session.done=!!(S.goal&&session.n>=S.goal);session.shown=session.done;updateScore();updateButtons();}
    if(prop==='kDiff'){if(!kAllowed(K.idx))kGo(K.idx);else renderPiano();}

});
$('#settings').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.chk){S[t.dataset.chk]=t.checked;saveS();if(t.dataset.chk==='drone'){if(!S.drone)stopDrone();else if(Q&&ctx&&Q.key!=null)startDrone(Q.key);}}
  if(t.dataset.group){S.groups[t.dataset.group]=t.checked;saveS();if(!Q||Q.graded)renderNodes();}
  if(t.dataset.q){S.quals[t.dataset.q]=t.checked;saveS();if(!Q||Q.graded){Q=null;renderNodes();}}
  if(t.id==='sKey'){S.key=t.value;saveS();}
  if(t.id==='sSound'){S.sound=t.value;saveS();}
  if(t.id==='bkFile'&&t.files&&t.files[0]){t.files[0].text().then(x=>bkDone(importData(x),'Progress loaded.'));}
});

/* ================= Backup ================= */
function exportData(){return JSON.stringify({app:'tonal-field',v:1,settings:S,stats:STATS});}
function importData(txt){
  try{const o=JSON.parse(String(txt).trim());if(!o||o.app!=='tonal-field'||!o.stats)return false;
    STATS=Object.assign(freshStats(),o.stats);saveStats();
    if(o.settings){S=Object.assign({},DEF,o.settings);S.groups=Object.assign({},DEF.groups,S.groups);S.quals=Object.assign({},DEF.quals,S.quals);saveS();}
    setSkin(S.skin);setMode(S.mode);return true;}catch(e){return false;}
}
function bkDone(ok,msg){const m=$('#bkMsg');if(m)m.textContent=ok?msg:'That didn’t look like Tonal Field progress.';}
async function backup(kind){
  const data=exportData(),m=$('#bkMsg');
  if(kind==='copy'){try{await navigator.clipboard.writeText(data);m.textContent='Copied. Open the other copy of the app and tap Paste progress.';}catch(e){window.prompt('Copy this text:',data);}}
  if(kind==='paste'){let txt=null;try{txt=await navigator.clipboard.readText();}catch(e){}if(!txt)txt=window.prompt('Paste your progress here:');if(txt)bkDone(importData(txt),'Progress pasted.');}
  if(kind==='save'){const name='tonal-field-progress.json',file=new File([data],name,{type:'application/json'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Tonal Field progress'});return;}}catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);m.textContent='Saved.';}
  if(kind==='load')$('#bkFile').click();
}
$('#settings').addEventListener('input',e=>{
  const t=e.target;if(!t.dataset.range)return;S[t.dataset.range]=+t.value;saveS();
  if(t.dataset.range==='droneVol'&&drone){drone.g.gain.cancelScheduledValues(now());drone.g.gain.setTargetAtTime(S.droneVol*.2,now(),.05);}
  if(t.dataset.range==='vol'&&master){master.gain.setTargetAtTime(S.vol,now(),.05);}
});

$('#nodes').addEventListener('click',e=>{
  const ch=e.target.closest('.chip');if(!ch||pocket)return;const v=ch.dataset.v;
  if(S.mode==='intervals'){if(Q&&!Q.graded)return answerInterval(v);
    if(Q){playDegreeNote(0,intSecond(v));}else{ac();stopAll();const b=bus();tone(b,60,now()+.05,.8,.14);tone(b,60+(+v||12),now()+.8,1,.14);sounding(1.9);}
    setIndicator(+v*30);showResult(INT[+v],null);}
  else if(S.mode==='degrees'){if(Q&&!Q.graded)return Q.multi?answerDegreeSeq(v):answerDegree(v);playDegreeNote(v);setIndicator(+v*30);showResult(DEG[+v],null);if(!Q)$('#feedback').innerHTML=`<div class="fb-line"><span class="fb-mark"></span><span class="fb-text"><b>${DEG[+v]}</b><span class="fb-feel">${DEGFEEL[+v]}</span></span></div>`;}
  else if(S.mode==='quality'){if(Q&&!Q.graded)return answerQuality(v);playQualityChord(v,Q?Q.root:0);setIndicator(qualAngles()[v]);}
  else if(S.mode==='context'){
    if(Q&&!Q.graded)return answerContext(v);
    const c=BYID[v],k=Q?Q.key:(S.key==='random'?0:+S.key),ton=curTon();
    if(!Q)setKeyName(`${keyName(k,ton)} ${tonWord(ton)}`);
    ac();stopAll();const e2=playVoicings([voicing((k+c.off)%12,c.q,0,null)],now()+.05,S.tempo);sounding(e2-now());
    setIndicator(c.off*30);showResult(c.lab,null);
  }
});

window.addEventListener('blur',releaseAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});

const WK={q:0,w:2,e:4,r:5,t:7,y:9,u:11,'2':1,'3':3,'5':6,'6':8,'7':10};
document.addEventListener('keydown',e=>{
  if(!$('#sheet').hidden){if(e.key==='Escape')closeSheet();return;}
  if(!$('#help').hidden){if(e.key==='Escape'){$('#help').hidden=true;$('#btnHelp').focus();}return;}
  if(e.target.closest('select,input')||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(S.mode==='key'){
    if(e.code==='Space'){e.preventDefault();mainAction();return;}
    if(k in WK){if(!e.repeat){holdStart(WK[k],'k'+k);kTap(WK[k]);}return;}
    if(k==='9')return kSetTon('maj'); if(k==='0')return kSetTon('min');
    if(e.key==='Enter'){if(e.target.closest('button'))return;e.preventDefault();return kCheck();}
    if(k==='z')return kReveal();
    if(e.key==='ArrowLeft')return kGo(K.idx-1,-1); if(e.key==='ArrowRight')return kGo(K.idx+1);
    return;
  }
  if(e.code==='Space'){e.preventDefault();mainAction();}
  else if(e.key==='Enter'){if(e.target.closest('button'))return;e.preventDefault();if(!Q||Q.graded)mainAction();}
  else if(e.key==='Backspace'&&(S.mode==='context'||(Q&&Q.multi))){$('#btnUndo').click();}
  else if(S.mode==='degrees'&&Q&&!Q.graded&&/^[1-7]$/.test(e.key)){const p=SCALE[Q.ton][+e.key-1];if(degChoices(Q.ton).includes(p))Q.multi?answerDegreeSeq(p):answerDegree(p);}
});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(S.mode==='key'&&k in WK)holdEnd('k'+k);});

const ICON_SPACE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="10.5" ry="3.6" transform="rotate(-20 12 12)"/></svg>';
const ICON_RADIO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M7 7l9-4"/><circle cx="15.5" cy="13.5" r="3"/><path d="M6.5 11.5h3M6.5 14.5h3"/></svg>';
function setSkin(s){S.skin=s;saveS();document.body.dataset.skin=s;
  const b=$('#btnTheme'),other=s==='space'?'Pocket radio':'Interstellar';b.innerHTML=s==='space'?ICON_RADIO:ICON_SPACE;
  b.title=`Switch to ${other}`;b.setAttribute('aria-label',`Switch to the ${other} theme`);
  setTimeout(readColors,50);}
$('#btnTheme').onclick=()=>setSkin(S.skin==='space'?'radio':'space');
function openSheet(){$('#sheet').hidden=false;renderSettings();renderStats();const c=$('#sheet [data-close].icon');c&&c.focus();}
function closeSheet(){$('#sheet').hidden=true;$('#btnGear').focus();}
$('#btnGear').onclick=openSheet;
const TOUCH=matchMedia('(hover:none) and (pointer:coarse)').matches;
const TAPS=[['▶ or tap the circle','Start, or go to the next question after you answer'],['Tap a label','Answer; after answering, hear any label'],['↻  ⌂  ↩  ↘  →','Replay · hear the key · undo · resolve home · next']];
const HELP_TOUCH={
  intervals:[...TAPS,['Replay','Hear the two notes again'],['Settings','Up, down, both, or together']],
  degrees:[...TAPS,['Hear key again','Replay the cadence'],['Resolve to 1','Walks the note home after you answer'],['Undo','Take back a note in a melody'],['Pocket mode','Hands-free practice, in Settings']],
  quality:[...TAPS,['Replay','Hear the chord again']],
  context:[...TAPS,['Hear key again','Replay the cadence'],['Undo','Take back your last chord'],['Pocket mode','Hands-free practice, in Settings']],
  key:[['Play','Start or pause the song'],['Tap or hold a key','Hear that note against the song'],['Double-tap a key','Choose it as home'],['maj / min','Choose major or minor'],['Check','Check your answer'],['‹ ›','Previous or next song'],['Dots on the ring','Jump to a song']]
};
const HELP={
  intervals:['Hear two notes and name the distance between them. Labels: m = minor, M = major, P = perfect, TT = tritone. Between questions, tap any interval to hear it.',[['Space','Start or replay'],['Enter','Next question']]],
  degrees:['Hear a cadence (or drone) set the key, then a note, or a short melody if you choose more notes in Settings. Name each scale degree. Between questions, tap any degree to hear it in the key.',[['Space','Start or replay'],['Enter','Next question'],['1–7','Answer with a scale degree'],['Backspace','Undo a note in a melody'],['Resolve to 1','Walks the note home after you answer']]],
  quality:['Hear a chord on a random root and name its quality. After answering, tap any quality to hear the same root with that color.',[['Space','Start or replay'],['Enter','Next question']]],
  context:['Hear the key, then one or more chords. Answer with Roman numerals on the circle, then spell the chord if that’s turned on. Between questions, tap any chord to hear it.',[['Space','Start or replay'],['Enter','Next question'],['Backspace','Undo the last answer'],['Pocket mode','Hands-free practice, in Settings']]],
  key:['Play the song and test notes against it. When one feels like home, double-tap it, pick major or minor, then check. Each visit puts the song in a new key. The dots around the circle are the songs; tap one to jump to it.',[['Space','Play or pause'],['Q W E R T Y U','C D E F G A B (hold to sustain)'],['2 3 5 6 7','The black keys'],['Press a key twice','Choose it as home'],['9 / 0','Major / minor'],['Enter','Check, or next song'],['Z','Show the key'],['← →','Previous or next song']]]
};
function openHelp(){const p=HELP[S.mode][0],rows=TOUCH?HELP_TOUCH[S.mode]:HELP[S.mode][1];$('#helpBody').innerHTML=`<p>${p}</p><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;$('#help').hidden=false;$('#help [data-close].icon').focus();}
$('#btnHelp').onclick=openHelp;
$('#help').addEventListener('click',e=>{if(e.target.closest('[data-close]')){$('#help').hidden=true;$('#btnHelp').focus();}});
$('#sheet').addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet();});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(readColors,50));
new MutationObserver(()=>setTimeout(readColors,50)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

initSky();setSkin(S.skin);setMode(S.mode);readColors();requestAnimationFrame(drawScope);
</script>
<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
